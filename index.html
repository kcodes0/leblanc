<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>leblanc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --fg: #f0ece4;
      --accent: #c9a96e;
      --accent2: #7b6cb7;
      --muted: #555;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Space Grotesk', sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* UI Navigation Pill */
    .ui-nav {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      display: flex;
      gap: 4px;
      padding: 6px 8px;
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(20px) saturate(1.8);
      -webkit-backdrop-filter: blur(20px) saturate(1.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .ui-nav.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(20px);
      pointer-events: none;
    }

    .ui-nav-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: rgba(255,255,255,0.4);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ui-nav-btn:hover {
      color: rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.08);
    }

    .ui-nav-btn.active {
      color: #fff;
      background: rgba(201, 169, 110, 0.3);
      box-shadow: 0 0 20px rgba(201, 169, 110, 0.2);
    }

    .ui-nav-btn.home-btn {
      font-size: 11px;
      letter-spacing: 0.5px;
      width: auto;
      padding: 0 14px;
      font-family: 'Syne', sans-serif;
      text-transform: lowercase;
    }

    /* Selector page */
    .selector-page {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .selector-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(201, 169, 110, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(123, 108, 183, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse 50% 60% at 10% 60%, rgba(201, 169, 110, 0.04) 0%, transparent 50%);
    }

    .selector-title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(3rem, 8vw, 7rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      position: relative;
      background: linear-gradient(135deg, var(--fg) 0%, var(--accent) 50%, var(--fg) 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 8s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { background-position: 0% center; }
      50% { background-position: 200% center; }
    }

    .selector-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 60px;
    }

    .selector-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 16px;
      padding: 0 40px;
      max-width: 900px;
    }

    @media (max-width: 768px) {
      .selector-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
    }

    .selector-card {
      width: 100px;
      height: 130px;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      background: rgba(255,255,255,0.02);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      overflow: hidden;
    }

    .selector-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: radial-gradient(circle at 50% 0%, rgba(201, 169, 110, 0.1) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .selector-card:hover {
      border-color: rgba(201, 169, 110, 0.3);
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3), 0 0 60px rgba(201, 169, 110, 0.05);
    }

    .selector-card:hover::before {
      opacity: 1;
    }

    .selector-card-num {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--fg);
      position: relative;
      z-index: 1;
    }

    .selector-card-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 8px;
      position: relative;
      z-index: 1;
    }

    /* Page transitions */
    .ui-container {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }

    .ui-container.active {
      opacity: 1;
      pointer-events: all;
    }

    /* Noise overlay */
    .noise {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px 256px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="noise"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
